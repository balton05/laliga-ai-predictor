name: season automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8,23 * * *"
      timezone: "America/Lima"

permissions:
  contents: read

concurrency:
  group: laliga-season-automation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Update results, predictions and simulations
        env:
          LALIGA_ENVIRONMENT: production
          LALIGA_DATABASE_URL: ${{ secrets.LALIGA_DATABASE_URL }}
          LALIGA_ADMIN_API_KEY: ${{ secrets.LALIGA_ADMIN_API_KEY }}
          LALIGA_PROJECT_ROOT: .
          LALIGA_AUTO_SYNC: "false"
          LALIGA_BOOTSTRAP_EMPTY_DATABASE: "false"
          LALIGA_AUTOMATION_ENABLED: "true"
          LALIGA_AUTOMATION_SIMULATIONS: "50000"
          LALIGA_DOCS_ENABLED: "false"
          LALIGA_ALLOWED_HOSTS: localhost,127.0.0.1
          LALIGA_CORS_ORIGINS: https://laliga-ai-predictor-josue.onrender.com
        run: python scripts/run_automation.py --trigger scheduled
