[project]
name = "laliga-ai-predictor"
version = "1.0.0"
description = "Prediction and simulation pipeline for LaLiga 2026/27."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.8,<1.9",
    "scipy>=1.14,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
