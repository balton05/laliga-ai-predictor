services:
  - type: web
    name: laliga-ai-predictor-josue
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: LALIGA_ENVIRONMENT
        value: production
      - key: LALIGA_DATABASE_URL
        sync: false
      - key: LALIGA_ADMIN_API_KEY
        generateValue: true
      - key: LALIGA_PROJECT_ROOT
        value: /app
      - key: LALIGA_AUTO_SYNC
        value: "false"
      - key: LALIGA_BOOTSTRAP_EMPTY_DATABASE
        value: "true"
      - key: LALIGA_AUTOMATION_ENABLED
        value: "true"
      - key: LALIGA_AUTOMATION_SIMULATIONS
        value: "50000"
      - key: LALIGA_DOCS_ENABLED
        value: "false"
      - key: LALIGA_SECURITY_HEADERS_ENABLED
        value: "true"
      - key: LALIGA_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: LALIGA_CORS_ORIGINS
        value: https://laliga-ai-predictor-josue.onrender.com
